name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  # The installers are unsigned; never try to auto-discover a signing identity on a runner.
  CSC_IDENTITY_AUTO_DISCOVERY: 'false'

jobs:
  windows-installers:
    name: windows installers
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # Renderer, main and preload bundles first, so a packaging failure below cannot be a
      # TypeScript or Vite failure wearing a different hat.
      - name: Bundle
        run: npm run build:renderer

      # The two targets that only need electron-builder's own cached toolchain.
      - name: Package NSIS and portable
        run: npx electron-builder --win nsis portable --publish never

      # Windows Installer needs the WiX toolchain; if that is unavailable on the runner, the
      # rest of the release still ships and this step reports the failure on its own.
      - name: Package MSI
        continue-on-error: true
        run: npx electron-builder --win msi --publish never

      - name: Checksums
        shell: bash
        run: |
          cd "release/$(ls release | head -n 1)"
          ls -l
          sha256sum *.exe *.msi > SHA256SUMS.txt || sha256sum *.exe > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: terrain-studio-windows
          path: |
            release/**/*.exe
            release/**/*.msi
            release/**/*.blockmap
            release/**/SHA256SUMS.txt
            release/**/builder-debug.yml
          if-no-files-found: warn

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd "release/$(ls release | head -n 1)"
          # The artifact names contain spaces, so build a real array: an unquoted $ASSETS would
          # split every filename into separate arguments.
          shopt -s nullglob
          files=( *.exe *.msi SHA256SUMS.txt )
          printf 'publishing: %s\n' "${files[@]}"
          # Re-cutting a tag turns its previous release into a draft, so uploading assets alone would
          # report success while nothing is public. Create when missing, upload when present, then
          # publish explicitly; `release view` is what the API check afterwards reads.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" \
              --notes "Terrain Studio $GITHUB_REF_NAME. Windows installers (NSIS setup, portable, and MSI) with SHA256SUMS.txt, including the MCreator plugin the app installs into %USERPROFILE%\\.mcreator\\plugins on first launch. Unsigned: SmartScreen warns on a machine that has not seen the build before." \
              "${files[@]}"
          fi
          gh release edit "$GITHUB_REF_NAME" --draft=false
          gh release view "$GITHUB_REF_NAME" --json tagName,isDraft,url
